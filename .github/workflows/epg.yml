name: fetch epg

on:
  schedule:
    - cron: "45 3,18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-epg
  cancel-in-progress: false

jobs:
  epg-fetcher:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv 
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install deps
        run: uv sync --locked

      - name: Fetch EPG
        run: uv run scripts/epg-fetch.py

      - name: Push changes
        uses: stefanzweifel/git-auto-commit-action@v7.2.0
        with:
          commit_message: "update EPG"
          file_pattern: "scripts/epg.xml"
          commit_author: "GitHub Actions Bot <actions@github.com>"
          commit_user_name: "GitHub Actions Bot"
          commit_user_email: "actions@github.com"
