name: fetch m3u8

on:
  schedule:
    - cron: "0,30 * * * *"   # Every hour at :00 and :30
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install deps
        run: uv sync --locked

      - name: Install Firefox only
        run: uv run playwright install firefox

      - name: Fetch M3U8
        run: uv run scripts/fetch.py

      - name: Push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "update m3u8 files"
          file_pattern: "playlists/*.m3u8"
          commit_author: "GitHub Actions Bot "
          commit_user_name: "GitHub Actions Bot"
          commit_user_email: "actions@github.com"