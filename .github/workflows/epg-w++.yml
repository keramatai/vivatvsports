name: fetch epg w++
on:
  schedule:
    # Runs daily at 03:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  grab-epg:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inject Credentials into w++ Config
        env:
          WG_EMAIL: ${{ secrets.WG_EMAIL }}
          WG_PASSWORD: ${{ secrets.WG_PASSWORD }}
        run: |
          if [ -n "\(WG_EMAIL" ] && [ -n "\)WG_PASSWORD" ]; then
            sed -i "s/YOUR_WG_EMAIL/$WG_EMAIL/g" scripts/WebGrab++.config.xml
            sed -i "s/YOUR_WG_PASSWORD/$WG_PASSWORD/g" scripts/WebGrab++.config.xml
          fi

      - name: Run w++ Docker
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/scripts:/config \
            -v ${{ github.workspace }}/scripts:/data \
            -e PUID=1000 \
            -e PGID=1000 \
            -e TZ=Etc/UTC \
            lscr.io/linuxserver/webgrabplus:latest

      - name: Upload XMLTV Artifact
        uses: actions/upload-artifact@v4
        with:
          name: epg-guide
          path: scripts/epg-w++.xml
          retention-days: 7